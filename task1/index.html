<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Translator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1>🌐 Text Translator</h1>

    <div class="language-row">
      <div class="language-box">
        <label for="sourceLanguage">Source Language</label>
        <select id="sourceLanguage">
          <option value="auto">Auto Detect</option>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="mr">Marathi</option>
          <option value="bn">Bengali</option>
        </select>
      </div>

      <button id="swapButton" title="Swap languages">⇄</button>

      <div class="language-box">
        <label for="targetLanguage">Target Language</label>
        <select id="targetLanguage">
          <option value="en">English</option>
          <option value="hi" selected>Hindi</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="mr">Marathi</option>
          <option value="bn">Bengali</option>
        </select>
      </div>
    </div>

    <label for="inputText">Enter text</label>
    <textarea id="inputText" rows="5" placeholder="Type text to translate..."></textarea>

    <button id="translateButton">Translate</button>

    <div id="status" class="status"></div>

    <label for="outputText">Translated text</label>
    <textarea id="outputText" rows="5" readonly placeholder="Translation will appear here..."></textarea>

    <div class="action-row">
      <button id="copyButton">📋 Copy</button>
      <button id="speakButton">🔊 Speak</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
